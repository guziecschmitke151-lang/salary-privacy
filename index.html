<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>КиноПоток — онлайн-кинотеатр</title>
<meta name="description" content="КиноПоток — онлайн-кинотеатр: смотрите фильмы бесплатно. Каталог, поиск, подборки, продолжение просмотра." />
<style>
  :root{
    --bg:#0b0b0f; --bg2:#12121a; --card:#16161f; --card2:#1e1e2a;
    --text:#f3f4f6; --muted:#9aa0ac; --accent:#ff4d6d; --accent2:#ff8a5c;
    --gold:#ffc53d; --radius:14px; --shadow:0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .container{max-width:1400px;margin:0 auto;padding:0 clamp(14px,3vw,40px)}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(11,11,15,.96),rgba(11,11,15,.75) 70%,transparent);
    backdrop-filter:blur(8px);
  }
  .nav{display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding:14px 0}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:.5px;white-space:nowrap}
  .logo .mark{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:19px;
    box-shadow:0 6px 18px rgba(255,77,109,.4);
  }
  .logo span{background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .nav-links{display:flex;gap:18px;color:var(--muted);font-size:15px}
  .nav-links a{padding:6px 2px;transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--text)}
  .search{margin-left:auto;position:relative;flex:1;max-width:420px}
  .search input{
    width:100%;padding:10px 14px 10px 40px;border-radius:999px;
    background:var(--card2);color:var(--text);border:1px solid #2a2a38;font-size:15px;outline:none;transition:.2s;
  }
  .search input:focus{border-color:var(--accent);background:#20202c}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);transition:.2s;flex:none}
  .icon-btn:hover{background:#2a2a38}

  /* ---------- Hero ---------- */
  .hero{position:relative;height:min(78vh,620px);display:flex;align-items:flex-end;margin-bottom:8px}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.1)}
  .hero-bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(11,11,15,.95) 0%,rgba(11,11,15,.5) 45%,rgba(11,11,15,.2) 100%),
               linear-gradient(0deg,var(--bg) 2%,transparent 55%);}
  .hero-content{position:relative;z-index:2;max-width:640px;padding-bottom:clamp(24px,5vw,64px)}
  .hero .badge{display:inline-flex;gap:6px;align-items:center;background:rgba(255,77,109,.15);color:var(--accent);
    padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:14px}
  .hero h1{font-size:clamp(30px,5vw,56px);margin:0 0 12px;line-height:1.05;font-weight:800}
  .hero-meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:15px;margin-bottom:14px;align-items:center}
  .hero-meta .rate{color:var(--gold);font-weight:700}
  .hero p{color:#d6d8de;font-size:16px;line-height:1.5;margin:0 0 22px;max-width:560px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:11px;font-weight:700;font-size:16px;transition:.18s}
  .btn-play{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 24px rgba(255,77,109,.35)}
  .btn-play:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,77,109,.5)}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(4px)}
  .btn-ghost:hover{background:rgba(255,255,255,.22)}

  /* ---------- Genre chips ---------- */
  .chips{display:flex;gap:10px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:8px 16px;border-radius:999px;background:var(--card2);color:var(--muted);font-size:14px;white-space:nowrap;transition:.18s;border:1px solid transparent}
  .chip:hover{color:var(--text)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}

  /* ---------- Rows ---------- */
  .row{margin:26px 0}
  .row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .row-head h2{font-size:clamp(18px,2.4vw,24px);margin:0;font-weight:700}
  .row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,20vw,210px);gap:16px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:thin;scroll-snap-type:x proximity}
  .row-scroll::-webkit-scrollbar{height:8px}
  .row-scroll::-webkit-scrollbar-thumb{background:#2a2a38;border-radius:8px}

  /* ---------- Card ---------- */
  .card{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card);cursor:pointer;
    scroll-snap-align:start;transition:transform .22s,box-shadow .22s}
  .card:hover{transform:translateY(-6px) scale(1.03);box-shadow:var(--shadow);z-index:2}
  .poster{aspect-ratio:2/3;width:100%;object-fit:cover;background:linear-gradient(135deg,#242433,#161620)}
  .poster.fallback{display:grid;place-items:center;text-align:center;padding:12px;font-weight:700;color:#cbd0da;font-size:15px}
  .card .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 55%);
    opacity:0;transition:opacity .22s;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
  .card:hover .ov{opacity:1}
  .card .ov .t{font-weight:700;font-size:15px;line-height:1.2}
  .card .ov .m{color:var(--muted);font-size:12.5px;margin-top:4px;display:flex;gap:8px;align-items:center}
  .card .play-fab{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;transition:.22s;
    width:52px;height:52px;border-radius:50%;background:rgba(255,77,109,.92);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .card:hover .play-fab{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .tag{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.7);color:var(--gold);font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;display:flex;gap:4px;align-items:center}
  .fav-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:.2s}
  .card:hover .fav-btn,.fav-btn.on{opacity:1}
  .fav-btn.on{color:var(--accent)}
  .progress{position:absolute;bottom:0;left:0;height:4px;background:var(--accent);border-radius:0 4px 0 0}

  /* ---------- Grid (search results) ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin:20px 0 40px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}

  /* ---------- Modal ---------- */
  .modal-back{position:fixed;inset:0;z-index:100;background:rgba(6,6,10,.8);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .modal-back.open{display:flex}
  .modal{background:var(--bg2);border-radius:18px;max-width:820px;width:100%;overflow:hidden;box-shadow:var(--shadow);position:relative;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
  .modal-hero{position:relative;aspect-ratio:16/8;background-size:cover;background-position:center}
  .modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2),transparent 60%)}
  .modal-close{position:absolute;top:14px;right:14px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:20px}
  .modal-close:hover{background:rgba(0,0,0,.85)}
  .modal-body{padding:0 clamp(18px,3vw,32px) 30px;position:relative;margin-top:-60px;z-index:2}
  .modal-body h2{font-size:clamp(24px,4vw,36px);margin:0 0 10px}
  .modal-meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:15px;align-items:center;margin-bottom:16px}
  .modal-meta .rate{color:var(--gold);font-weight:700}
  .genre-pill{background:var(--card2);padding:4px 11px;border-radius:999px;font-size:13px;color:#cfd3db}
  .modal-body p{color:#d6d8de;line-height:1.6;font-size:15.5px}
  .modal-actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 4px}
  .lic{margin-top:22px;font-size:13px;color:var(--muted);border-top:1px solid #23232f;padding-top:16px}

  /* ---------- Player ---------- */
  .player-back{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}
  .player-back.open{display:flex}
  .player-bar{display:flex;align-items:center;gap:14px;padding:14px 20px;color:#fff}
  .player-bar .title{font-weight:700;font-size:17px}
  .player-wrap{flex:1;display:grid;place-items:center;padding:0 10px 10px}
  .player-wrap video{width:100%;max-width:1200px;max-height:100%;border-radius:10px;background:#000}

  footer{border-top:1px solid #1c1c26;color:var(--muted);font-size:14px;margin-top:40px}
  footer .container{padding-top:28px;padding-bottom:36px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
  footer a{color:var(--muted)}footer a:hover{color:var(--text)}

  @media(max-width:640px){
    .nav-links{display:none}
    .hero{height:min(70vh,520px)}
    .search{max-width:none}
  }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <div class="logo"><span class="mark">🎬</span><span>КиноПоток</span></div>
    <nav class="nav-links">
      <a href="#" data-nav="home" class="active">Главная</a>
      <a href="#" data-nav="movies">Фильмы</a>
      <a href="#" data-nav="fav">Избранное</a>
    </nav>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Поиск фильмов…" autocomplete="off" />
    </div>
  </div>
</header>

<main>
  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="container hero-content">
      <span class="badge">🔥 Сейчас смотрят</span>
      <h1 id="heroTitle">—</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p id="heroDesc"></p>
      <div class="hero-actions">
        <button class="btn btn-play" id="heroPlay">▶ Смотреть</button>
        <button class="btn btn-ghost" id="heroInfo">ℹ Подробнее</button>
      </div>
    </div>
  </section>

  <div class="container">
    <!-- GENRE CHIPS -->
    <div class="chips" id="chips"></div>

    <!-- ROWS (home) -->
    <div id="rows"></div>

    <!-- SEARCH / FILTER GRID -->
    <section id="gridSection" style="display:none">
      <div class="row-head"><h2 id="gridTitle">Результаты</h2></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</main>

<footer>
  <div class="container">
    <div>© 2026 КиноПоток — онлайн-кинотеатр. Все фильмы в каталоге распространяются по свободным лицензиям.</div>
    <div><a href="privacy-policy.html">Политика конфиденциальности</a></div>
  </div>
</footer>

<!-- INFO MODAL -->
<div class="modal-back" id="modalBack">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-hero" id="modalHero"></div>
    <div class="modal-body">
      <h2 id="mTitle"></h2>
      <div class="modal-meta" id="mMeta"></div>
      <p id="mDesc"></p>
      <div class="modal-actions">
        <button class="btn btn-play" id="mPlay">▶ Смотреть</button>
        <button class="btn btn-ghost" id="mFav">☆ В избранное</button>
      </div>
      <div class="lic" id="mLic"></div>
    </div>
  </div>
</div>

<!-- PLAYER -->
<div class="player-back" id="playerBack">
  <div class="player-bar">
    <button class="icon-btn" id="playerClose" title="Закрыть">✕</button>
    <div class="title" id="playerTitle"></div>
  </div>
  <div class="player-wrap">
    <video id="video" controls playsinline preload="metadata"></video>
  </div>
</div>

<script>
/* ============================================================
   КиноПоток — онлайн-кинотеатр (демо-каталог)
   Видео — легальные фильмы по свободным лицензиям
   (Blender Open Movies, CC-BY) + публичные демо-ролики.
   Чтобы подключить свой лицензионный источник — замените
   поле "video" у нужного фильма на URL вашего потока (mp4/HLS).
   ============================================================ */
const V = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/";

const MOVIES = [
  { id:"bbb", title:"Большой Кролик Бак", year:2008, rating:8.1, dur:"10 мин",
    genres:["Анимация","Комедия","Семейный"],
    img:V+"images/BigBuckBunny.jpg", video:V+"BigBuckBunny.mp4",
    lic:"Blender Foundation · Creative Commons Attribution (CC-BY)",
    desc:"Добродушный великан-кролик наслаждается тихим утром в лесу, пока трое вредных грызунов не решают испортить ему день. Добрая и остроумная короткометражка, ставшая символом свободной анимации." },

  { id:"sintel", title:"Синтель", year:2010, rating:7.6, dur:"15 мин",
    genres:["Анимация","Фэнтези","Драма"],
    img:V+"images/Sintel.jpg", video:V+"Sintel.mp4",
    lic:"Blender Foundation · Creative Commons Attribution (CC-BY)",
    desc:"Одинокая девушка Синтель отправляется в опасное путешествие через заснеженные горы и пустоши в поисках потерянного друга — маленького дракона. История о привязанности, утрате и цене верности." },

  { id:"ed", title:"Сон Слона", year:2006, rating:6.9, dur:"11 мин",
    genres:["Анимация","Фантастика"],
    img:V+"images/ElephantsDream.jpg", video:V+"ElephantsDream.mp4",
    lic:"Blender Foundation · Creative Commons Attribution (CC-BY)",
    desc:"Двое странников блуждают по бесконечному механическому миру из проводов, машин и меняющейся архитектуры. Первый в мире открытый анимационный фильм — сюрреалистичный и завораживающий." },

  { id:"tos", title:"Слёзы Стали", year:2012, rating:6.6, dur:"12 мин",
    genres:["Фантастика","Боевик"],
    img:V+"images/TearsOfSteel.jpg", video:V+"TearsOfSteel.mp4",
    lic:"Blender Foundation · Creative Commons Attribution (CC-BY)",
    desc:"В футуристическом Амстердаме группа воинов и учёных пытается предотвратить восстание машин, вернувшись к событиям прошлого. Смелое сочетание живой съёмки и компьютерной графики." },

  { id:"blazes", title:"Большое Пламя", year:2015, rating:6.2, dur:"15 сек",
    genres:["Короткометражка","Приключения"],
    img:V+"images/ForBiggerBlazes.jpg", video:V+"ForBiggerBlazes.mp4",
    lic:"Google · демонстрационный ролик",
    desc:"Короткий динамичный ролик о ярких моментах, которые хочется смотреть на большом экране." },

  { id:"escapes", title:"Большой Побег", year:2015, rating:6.0, dur:"15 сек",
    genres:["Короткометражка","Приключения"],
    img:V+"images/ForBiggerEscapes.jpg", video:V+"ForBiggerEscapes.mp4",
    lic:"Google · демонстрационный ролик",
    desc:"Небольшая история о побеге от рутины и стремлении к приключениям." },

  { id:"fun", title:"Большое Веселье", year:2015, rating:6.1, dur:"1 мин",
    genres:["Короткометражка","Семейный"],
    img:V+"images/ForBiggerFun.jpg", video:V+"ForBiggerFun.mp4",
    lic:"Google · демонстрационный ролик",
    desc:"Лёгкий и жизнерадостный ролик о простых радостях и хорошем настроении." },

  { id:"joy", title:"Большие Поездки", year:2015, rating:6.3, dur:"15 сек",
    genres:["Короткометражка","Приключения"],
    img:V+"images/ForBiggerJoyrides.jpg", video:V+"ForBiggerJoyrides.mp4",
    lic:"Google · демонстрационный ролик",
    desc:"Захватывающие кадры дорог, скорости и свободы движения." },

  { id:"melt", title:"Большие Перемены", year:2015, rating:5.9, dur:"15 сек",
    genres:["Короткометражка","Драма"],
    img:V+"images/ForBiggerMeltdowns.jpg", video:V+"ForBiggerMeltdowns.mp4",
    lic:"Google · демонстрационный ролик",
    desc:"Эмоциональный микро-сюжет о резких поворотах и переменах в жизни." },

  { id:"subaru", title:"Дорога и Бездорожье", year:2014, rating:6.4, dur:"1 мин",
    genres:["Документальный","Приключения"],
    img:V+"images/SubaruOutbackOnStreetAndDirt.jpg", video:V+"SubaruOutbackOnStreetAndDirt.mp4",
    lic:"Публичный демонстрационный ролик",
    desc:"Путешествие по асфальту и грунтовым тропам — о свободе дороги и любви к путешествиям." },

  { id:"vw", title:"Тест-Драйв", year:2013, rating:6.0, dur:"3 мин",
    genres:["Документальный"],
    img:V+"images/VolkswagenGTIReview.jpg", video:V+"VolkswagenGTIReview.mp4",
    lic:"Публичный демонстрационный ролик",
    desc:"Подробный взгляд на характер и повадки культового хот-хэтча — для тех, кто любит автомобили." },

  { id:"bullrun", title:"На Полном Ходу", year:2013, rating:6.5, dur:"4 мин",
    genres:["Документальный","Приключения"],
    img:V+"images/WeAreGoingOnBullrun.jpg", video:V+"WeAreGoingOnBullrun.mp4",
    lic:"Публичный демонстрационный ролик",
    desc:"Хроника большого автопробега — драйв, команда и тысячи километров дороги впереди." },

  { id:"grand", title:"Что Купить За Гроши", year:2013, rating:5.8, dur:"4 мин",
    genres:["Документальный"],
    img:V+"images/WhatCarCanYouGetForAGrand.jpg", video:V+"WhatCarCanYouGetForAGrand.mp4",
    lic:"Публичный демонстрационный ролик",
    desc:"Ироничный эксперимент: на что способен автомобиль, купленный за минимальные деньги." },
];

/* ---------- storage helpers ---------- */
const LS = {
  favs(){ try{return JSON.parse(localStorage.getItem("kp_favs")||"[]")}catch(e){return[]} },
  setFavs(a){ localStorage.setItem("kp_favs",JSON.stringify(a)) },
  toggleFav(id){ let f=LS.favs(); f.includes(id)?f=f.filter(x=>x!==id):f.push(id); LS.setFavs(f); return f.includes(id) },
  prog(){ try{return JSON.parse(localStorage.getItem("kp_prog")||"{}")}catch(e){return{}} },
  setProg(id,t,d){ const p=LS.prog(); p[id]={t,d,ts:t/(d||1)}; localStorage.setItem("kp_prog",JSON.stringify(p)) },
};
const byId = id => MOVIES.find(m=>m.id===id);

/* ---------- render helpers ---------- */
function card(m){
  const el=document.createElement("div");
  el.className="card"; el.dataset.id=m.id;
  const fav=LS.favs().includes(m.id);
  const p=LS.prog()[m.id];
  const pct=p&&p.d?Math.min(100,(p.t/p.d)*100):0;
  el.innerHTML=`
    <div class="tag">★ ${m.rating.toFixed(1)}</div>
    <button class="fav-btn ${fav?'on':''}" data-fav="${m.id}" title="В избранное">${fav?'♥':'♡'}</button>
    <img class="poster" src="${m.img}" alt="${m.title}" loading="lazy"
         onerror="this.classList.add('fallback');this.removeAttribute('src');this.textContent='${m.title.replace(/'/g,"")}'">
    <div class="play-fab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="ov">
      <div class="t">${m.title}</div>
      <div class="m"><span>${m.year}</span>•<span>${m.genres[0]}</span>•<span>${m.dur}</span></div>
    </div>
    ${pct>2&&pct<97?`<div class="progress" style="width:${pct}%"></div>`:""}`;
  el.addEventListener("click",e=>{
    if(e.target.closest("[data-fav]")){ const on=LS.toggleFav(m.id); const b=e.target.closest("[data-fav]");
      b.classList.toggle("on",on); b.textContent=on?"♥":"♡"; return; }
    if(e.target.closest(".play-fab")){ openPlayer(m); return; }
    openModal(m);
  });
  return el;
}

function rowEl(title,list){
  if(!list.length) return null;
  const wrap=document.createElement("div"); wrap.className="row";
  const head=document.createElement("div"); head.className="row-head";
  head.innerHTML=`<h2>${title}</h2>`;
  const sc=document.createElement("div"); sc.className="row-scroll";
  list.forEach(m=>sc.appendChild(card(m)));
  wrap.append(head,sc); return wrap;
}

/* ---------- home rows ---------- */
function buildRows(){
  const rows=document.getElementById("rows"); rows.innerHTML="";
  const prog=LS.prog();
  const cont=MOVIES.filter(m=>prog[m.id]&&prog[m.id].ts>0.02&&prog[m.id].ts<0.95)
                   .sort((a,b)=>(prog[b.id].t)-(prog[a.id].t));
  const favs=LS.favs().map(byId).filter(Boolean);
  const anim=MOVIES.filter(m=>m.genres.includes("Анимация"));
  const scifi=MOVIES.filter(m=>m.genres.includes("Фантастика")||m.genres.includes("Боевик"));
  const shorts=MOVIES.filter(m=>m.genres.includes("Короткометражка"));
  const docs=MOVIES.filter(m=>m.genres.includes("Документальный"));
  const popular=[...MOVIES].sort((a,b)=>b.rating-a.rating);
  [
    ["▶ Продолжить просмотр",cont],
    ["♥ Избранное",favs],
    ["🔥 Популярное",popular],
    ["🎨 Анимация",anim],
    ["🚀 Фантастика и боевики",scifi],
    ["🎬 Короткометражки",shorts],
    ["🎥 Документальные",docs],
  ].forEach(([t,l])=>{ const r=rowEl(t,l); if(r)rows.appendChild(r); });
}

/* ---------- genre chips / filter ---------- */
let activeGenre="Все";
function buildChips(){
  const set=new Set(["Все"]); MOVIES.forEach(m=>m.genres.forEach(g=>set.add(g)));
  const chips=document.getElementById("chips"); chips.innerHTML="";
  [...set].forEach(g=>{
    const c=document.createElement("button"); c.className="chip"+(g===activeGenre?" active":"");
    c.textContent=g; c.onclick=()=>{ activeGenre=g; buildChips(); applyView(); };
    chips.appendChild(c);
  });
}

/* ---------- view switching ---------- */
const $=s=>document.querySelector(s);
let mode="home"; // home | search | fav
function applyView(){
  const q=$("#search").value.trim().toLowerCase();
  const gridSec=$("#gridSection"), rows=$("#rows"), chips=$("#chips");
  let list=MOVIES.slice();
  if(mode==="fav") list=LS.favs().map(byId).filter(Boolean);
  if(activeGenre!=="Все") list=list.filter(m=>m.genres.includes(activeGenre));
  if(q) list=list.filter(m=>m.title.toLowerCase().includes(q)||m.genres.join(" ").toLowerCase().includes(q));

  const filtering = q || activeGenre!=="Все" || mode==="fav";
  if(filtering){
    rows.style.display="none"; gridSec.style.display="";
    $("#gridTitle").textContent = mode==="fav" ? "Избранное"
      : q ? `Поиск: «${$("#search").value.trim()}»` : activeGenre;
    const grid=$("#grid"); grid.innerHTML="";
    if(!list.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1">Ничего не найдено 🙁</div>`; }
    else list.forEach(m=>grid.appendChild(card(m)));
  }else{
    rows.style.display=""; gridSec.style.display="none"; buildRows();
  }
}

/* ---------- hero ---------- */
function setHero(m){
  $("#heroBg").style.backgroundImage=`url('${m.img}')`;
  $("#heroTitle").textContent=m.title;
  $("#heroMeta").innerHTML=`<span class="rate">★ ${m.rating.toFixed(1)}</span>
     <span>${m.year}</span><span>${m.dur}</span><span>${m.genres.join(" · ")}</span>`;
  $("#heroDesc").textContent=m.desc;
  $("#heroPlay").onclick=()=>openPlayer(m);
  $("#heroInfo").onclick=()=>openModal(m);
}

/* ---------- info modal ---------- */
let currentModal=null;
function openModal(m){
  currentModal=m;
  $("#modalHero").style.backgroundImage=`url('${m.img}')`;
  $("#mTitle").textContent=m.title;
  $("#mMeta").innerHTML=`<span class="rate">★ ${m.rating.toFixed(1)}</span><span>${m.year}</span><span>${m.dur}</span>`
    + m.genres.map(g=>`<span class="genre-pill">${g}</span>`).join("");
  $("#mDesc").textContent=m.desc;
  $("#mLic").innerHTML=`ℹ️ Лицензия: ${m.lic}`;
  const favOn=LS.favs().includes(m.id);
  const fb=$("#mFav"); fb.textContent=favOn?"♥ В избранном":"☆ В избранное";
  fb.onclick=()=>{ const on=LS.toggleFav(m.id); fb.textContent=on?"♥ В избранном":"☆ В избранное"; };
  $("#mPlay").onclick=()=>{ closeModal(); openPlayer(m); };
  $("#modalBack").classList.add("open"); document.body.style.overflow="hidden";
}
function closeModal(){ $("#modalBack").classList.remove("open"); document.body.style.overflow=""; }

/* ---------- player ---------- */
let currentPlay=null;
function openPlayer(m){
  currentPlay=m;
  const v=$("#video");
  $("#playerTitle").textContent=m.title;
  v.src=m.video;
  const p=LS.prog()[m.id];
  v.currentTime=0;
  $("#playerBack").classList.add("open"); document.body.style.overflow="hidden";
  v.play().catch(()=>{});
  v.onloadedmetadata=()=>{ if(p&&p.t&&p.t<v.duration-5) v.currentTime=p.t; };
  v.ontimeupdate=()=>{ if(v.duration) LS.setProg(m.id,v.currentTime,v.duration); };
}
function closePlayer(){
  const v=$("#video");
  if(currentPlay&&v.duration) LS.setProg(currentPlay.id,v.currentTime,v.duration);
  v.pause(); v.removeAttribute("src"); v.load();
  $("#playerBack").classList.remove("open"); document.body.style.overflow="";
  currentPlay=null; buildRows(); if($("#gridSection").style.display!=="none") applyView();
}

/* ---------- events ---------- */
$("#modalClose").onclick=closeModal;
$("#modalBack").onclick=e=>{ if(e.target.id==="modalBack") closeModal(); };
$("#playerClose").onclick=closePlayer;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#playerBack").classList.contains("open"))closePlayer(); else closeModal(); }});
let st;
$("#search").addEventListener("input",()=>{ clearTimeout(st); st=setTimeout(()=>{ if(mode==="fav")mode="home"; applyView(); },180); });
document.querySelectorAll("[data-nav]").forEach(a=>a.addEventListener("click",e=>{
  e.preventDefault();
  document.querySelectorAll("[data-nav]").forEach(x=>x.classList.remove("active"));
  a.classList.add("active");
  const nav=a.dataset.nav;
  if(nav==="fav"){ mode="fav"; }
  else { mode="home"; activeGenre="Все"; $("#search").value=""; buildChips(); }
  applyView();
  window.scrollTo({top:0,behavior:"smooth"});
}));

/* ---------- init ---------- */
setHero(MOVIES[0]);
buildChips();
applyView();
</script>
</body>
</html>
